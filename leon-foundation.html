function home(){V='home';const due=dueList(),ds=Object.values(K.it).map(r=>r.d).filter(d=>d>Date.now());
 let h='<div class="top"><button class="g" onclick="who()">'+K.av+' '+esc(K.name)+'</button><span>⭐ '+K.xp+'</span><span>🔥 '+K.st+'</span><button class="g" onclick="gate()">👨‍👩‍👧</button></div><div class="card"><div>🦁 '+(due.length?'عندك '+due.length+' للمراجعة، هيا نتذكرها!':'مرحباً يا بطل! جاهز نتعلم؟')+'</div><br><button '+(due.length?'':'class="g" ')+'onclick="review()">🔁 مراجعة ذكية'+(due.length?' ('+due.length+')':'')+'</button>'+(!due.length&&ds.length?'<p class="mut">المراجعة التالية بعد '+fmt(Math.min(...ds)-Date.now())+'</p>':'')+'</div>'+(S.ai?'<button onclick="aiQuiz()">🤖 اختبار ذكي من أخطائي</button><br><br>':'')+'<button class="g" onclick="chars()">🎁 شخصياتي</button>'+(DP?'<br><br><button class="g" onclick="DP.prompt()">📲 تثبيت التطبيق</button>':'')+'<br><br><button class="g" onclick="tst2()">🔊 اختبار الصوت</button><h3>خريطة التعلم</h3>';
 LS.forEach((l,i)=>{const open=S.unl||i==0||(K.done[i-1]||0)>=2,s=K.done[i]||0;h+='<button class="node" '+(open?'':'disabled ')+'onclick="lesson('+i+')"><span>'+(open?l.ic:'🔒')+' '+l.t+'</span><span>'+('⭐'.repeat(s)||(open?'▶':''))+'</span></button>'});A.innerHTML=h}
// ---- Sessions ----
const mkS=o=>Object.assign({h:5,x0:K.xp,ok:0,bad:0,xp:0,i:0,in:0,rq:new Set(),adv:new Set(),hurt:new Set(),t0:Date.now()},o);
function lesson(i){ses=mkS({m:'l',id:i,items:LS[i].items});showIntro()}
function showIntro(){V='intro';const it=ses.items[ses.in];
 A.innerHTML='<div class="top"><button class="g" onclick="home()">✖</button><div class="bar"><i style="width:'+ses.in/ses.items.length*100+'%"></i></div></div><div class="card" style="text-align:center"><p class="mut">👆 اضغط على الحرف أو الصورة أو الكلمة لتسمعها</p><div class="big en tap" onclick="say(spk(ses.items[ses.in]))">'+(it.t=='L'?it.c+' '+it.c.toLowerCase():it.t=='N'?it.n:it.e)+'</div><div class="big tap" onclick="say(ses.items[ses.in].w)" style="font-size:'+(it.e?72:30)+'px">'+(it.t=='W'||it.t=='S'||it.t=='V'?'':it.e||(it.n<=10?'⭐'.repeat(it.n):'✨'))+'</div><h2 class="en tap" onclick="say(ses.items[ses.in].w)">'+(it.q?'<small class="mut">🦁 '+it.q+'</small><br>':'')+it.w+'</h2><p>'+it.ar+'</p><button onclick="sayIt(ses.items[ses.in])">🔊 اسمع</button>'+(SR?'<br><br><button class="g" onclick="mic()">🎤 قلها أنت</button><div id="mr" class="mut"></div>':'')+'</div><button onclick="nx()">التالي ◀</button>';sayIt(it)}
function nx(){ses.in++;if(ses.in<ses.items.length)return showIntro();ses.qs=sh(ses.items.flatMap(it=>[mk(it),mk(it)]));ses.n=ses.qs.length;ses.i=0;showQ()}
function review(){const d=dueList().slice(0,8);if(!d.length)return home();ses=mkS({m:'r',qs:d.map(mk)});ses.n=ses.qs.length;showQ()}
function mk(it){if(it.t=='V')return mkV(it);if(it.t=='S')return mk6(it);const T=['hear','pic','word'];if(it.t=='L')T.push('case');if(sc(it).length<=6)T.push('scr');
 let ty=rnd(T);if(ty=='pic'&&it.t=='N'&&it.n>10)ty='hear';
 const o=f=>sh([it,...dis(it)]).map(x=>({k:x.k,h:f(x)})),q={it,ty,ans:it.k};
 if(ty=='hear'){q.p='اسمع واختر 🔊';q.say=spk(it);q.big='🔊';q.o=o(lab)}
 else if(ty=='pic'){if(it.t=='L'){q.p='بأي حرف تبدأ هذه الكلمة؟';q.big=it.e;q.say=it.w;q.o=o(lab)}else if(it.t=='W'){q.p='ما اسمها بالإنجليزية؟';q.big=it.e;q.say=it.w;q.o=o(x=>x.w)}else{q.p='كم العدد؟';q.big='⭐'.repeat(it.n);q.sm=1;q.o=o(lab)}}
 else if(ty=='word'){if(it.t=='L'){q.p='اسمع واختر الصورة 🔊';q.say=it.w;q.big='🔊';q.o=o(x=>x.e)}else if(it.t=='W'){q.p='اقرأ واختر المعنى';q.big=it.w;q.sm=1;q.say=it.w;q.o=o(x=>x.e)}else{q.p='اختر الكلمة الصحيحة';q.big=it.n;q.say=it.w;q.o=o(x=>x.w)}}
 else if(ty=='case'){q.p='اختر الحرف الصغير';q.big=it.c;q.o=o(x=>x.c.toLowerCase())}
 else{q.p='رتّب الحروف لتكوين الكلمة';q.big=it.e||it.n;q.w=sc(it)}
 return q}
function showQ(){V='q';ses.lock=0;const q=ses.qs[ses.i];Q=q;
 let h='<div class="top"><button class="g" onclick="home()">✖</button><div class="bar"><i style="width:'+ses.i/ses.qs.length*100+'%"></i></div>'+(ses.m=='l'?'<b>❤️'+Math.max(ses.h,0)+'</b>':'')+'</div><div class="card"><div>🦁 '+q.p+'</div><div class="big en'+(q.say?' tap':'')+'" '+(q.say?'onclick="say(Q.say)" ':'')+'style="'+(q.sm?'font-size:36px':'')+'">'+q.big+'</div></div>';
 if(q.ty=='scr'||q.ty=='ord'){if(!q.L){q.L=sh(q.w.split(''));q.cur=[]}
  h+='<div class="big en" style="font-size:'+(q.S?22:40)+'px;min-height:56px">'+(q.cur.map(i=>q.L[i]).join(q.S||'')||'_ '.repeat(q.L.length))+'</div><div class="g3">'+q.L.map((c,i)=>'<button class="opt" style="font-size:'+(q.S?20:28)+'px" '+(q.cur.includes(i)?'disabled ':'')+'onclick="pk('+i+')">'+c+'</button>').join('')+'</div><button class="g" onclick="Q.cur=[];showQ()">↺ مسح</button>'}
 else h+='<div class="grid">'+q.o.map((x,i)=>'<button class="opt en" onclick="ans('+i+')">'+x.h+'</button>').join('')+'</div>';
 A.innerHTML=h;if(q.say)say(q.say)}
function pk(i){if(ses.lock||Q.cur.includes(i))return;Q.cur.push(i);const w=Q.cur.map(j=>Q.L[j]).join(Q.S||'');showQ();if(Q.cur.length==Q.L.length)fin(w==(Q.S?Q.w.join(Q.S):Q.w))}
function ans(i){if(ses.lock)return;const ok=Q.o[i].k==Q.ans;document.querySelectorAll('.opt').forEach((b,j)=>{if(Q.o[j].k==Q.ans)b.classList.add('ok');else if(j==i)b.classList.add('no')});fin(ok)}
function fin(ok){if(ses.lock)return;ses.lock=1;const it=Q.it;rec(it.k,ok);
 if(ok){ses.ok++;K.xp+=10;ses.xp+=10;beep(1)}else{ses.bad++;if(ses.m=='l'&&--ses.h<=0)ses.out=1;beep(0);if(!ses.rq.has(it.k)){ses.rq.add(it.k);ses.qs.push(mk(it))}}
 save();A.insertAdjacentHTML('beforeend','<div class="card fb '+(ok?'ok':'no')+'"><div>🦁 '+(ok?rnd(PR):'ولا يهمك، نتعلمها معاً 💛<br>'+expl(it)+'<div id="aix" class="mut"></div>')+'</div><br><button onclick="nxq()">متابعة ◀</button></div>');
 sayIt(it);A.lastElementChild.scrollIntoView({behavior:'smooth'});if(!ok&&S.ai)ai('/explain',{type:it.t,en:it.w||it.c||''+it.n,ar:it.ar,q:it.q}).then(r=>{const e=$('#aix');if(r&&r.text&&e)e.textContent='🤖 '+r.text})}
function nxq(){ses.i++;ses.i>=ses.qs.length||ses.out?doneV():showQ()}
function doneV(){V='done';const a=ses.n/(ses.ok+ses.bad),st=ses.out?1:a>=.9?3:a>=.7?2:1;K.ms+=Date.now()-ses.t0;K.ss++;const t=td();if(K.last!=t){K.st=K.last==yd()?K.st+1:1;K.last=t}
 let msg='مراجعة رائعة! الذاكرة تقوى 💪',nxt='';
 if(ses.m=='l'){K.xp+=20;ses.xp+=20;K.done[ses.id]=Math.max(K.done[ses.id]||0,st);
  if(st>=2){msg='أنهيت الدرس! فتحت الدرس التالي 🎉';if(ses.id+1<LS.length)nxt='<button onclick="lesson('+(ses.id+1)+')">الدرس التالي ◀</button>'}
  else{msg='قريب جداً! أعد الدرس لتتقنه قبل الانتقال 💪';nxt='<button onclick="lesson('+ses.id+')">إعادة الدرس 🔁</button>'}}
 save();const nw=CH.filter(c=>c[1]>ses.x0&&c[1]<=K.xp);A.innerHTML=(nw.length?'<div class="card" style="text-align:center">🎁 فتحت شخصية جديدة!<div class="big">'+nw.map(c=>c[0]).join(' ')+'</div></div>':'')+'<div class="card" style="text-align:center"><div class="big">🎉</div>'+(ses.m=='l'?'<div class="big" style="font-size:40px">'+'⭐'.repeat(st)+'</div>':'')+'<h2>'+msg+'</h2><p>+'+ses.xp+' XP ⭐ &nbsp; 🔥 '+K.st+' يوم</p></div>'+nxt+'<br><br><button class="g" onclick="home()">الرئيسية</button>'}
// ---- Parent ----
function gate(){V='gate';G=[2+Math.floor(Math.random()*8),2+Math.floor(Math.random()*8)];A.innerHTML='<div class="card"><h3>منطقة ولي الأمر</h3><p>كم ناتج <span class="en">'+G[0]+' × '+G[1]+'</span>؟</p><input id="gv" type="number" inputmode="numeric"><button onclick="+$(\'#gv\').value==G[0]*G[1]?parent():gate()">دخول</button><br><br><button class="g" onclick="home()">رجوع</button></div>'}
function parent(){V='parent';const n=Date.now(),comp=LS.filter((l,i)=>(K.done[i]||0)>=2).length,rs=IT.filter(i=>K.it[i.k]),ms=rs.filter(i=>K.it[i.k].b>=2),wk=rs.filter(i=>K.it[i.k].w>0).sort((a,b)=>K.it[b.k].w-K.it[a.k].w),rep=wk.filter(i=>K.it[i.k].w>=2),due=rs.filter(i=>K.it[i.k].d<=n).length,soon=rs.filter(i=>K.it[i.k].d>n&&K.it[i.k].d<=n+864e5).length;
 const ch=(l,c)=>l.length?l.map(i=>'<span class="chip en">'+lab(i)+(c?' ×'+K.it[i.k].w:'')+'</span>').join(''):'<span class="mut">لا يوجد بعد</span>',nx=LS[Math.min(comp,LS.length-1)];
 A.innerHTML='<div class="top"><h3>'+K.av+' '+esc(K.name)+'</h3><button class="g" onclick="home()">رجوع</button></div><div class="card">✅ الدروس المكتملة: <b>'+comp+' / '+LS.length+'</b><div class="bar"><i style="width:'+comp/LS.length*100+'%"></i></div>📈 نسبة التقدم: <b>'+Math.round(comp/LS.length*100)+'%</b><br>🎯 المستوى الحالي: <b>'+nx.t+'</b><br>⏱ وقت التعلم: <b>'+Math.round(K.ms/6e4)+' دقيقة</b> ('+K.ss+' جلسة)<br>⭐ XP: '+K.xp+' &nbsp; 🔥 '+K.st+' يوم</div><div class="card"><b>أتقنها:</b><br>'+ch(ms)+'</div><div class="card"><b>أخطاء متكررة:</b><br>'+ch(rep,1)+'</div><div class="card"><b>المراجعات القادمة:</b> '+due+' الآن، و'+soon+' خلال 24 ساعة</div><div class="card"><b>اقتراحات:</b><br>'+(wk.length?'ركّزوا على: '+ch(wk.slice(0,3)):'ممتاز! لا توجد نقاط ضعف حالياً.')+'<br>'+(comp<LS.length?'الدرس المقترح: '+nx.t:'أنهى الطفل كل دروس هذه النسخة 🎉')+'</div><div class="card"><b>🤖 المدرس الذكي</b><p class="mut">رابط الـ Backend (بدون أي مفاتيح)</p><input id="aiu" class="en" placeholder="https://..." value="'+esc(S.ai||'')+'"><button onclick="aiSave()">حفظ واختبار</button><br><br><button class="g" onclick="S.unl=!S.unl;save();parent()">'+(S.unl?'🔓 كل الدروس مفتوحة (اضغط للقفل)':'🔒 فتح كل الدروس (للتجربة)')+'</button></div><button class="g" onclick="if(confirm(\'مسح تقدم هذا الطفل؟\')){S.kids.splice(S.cur,1);delete S.cur;save();who()}">🗑 مسح هذا الملف</button>'}
function tst2(){lv();const n=VO.length,en=VO.filter(v=>/^en/i.test(v.lang)).length;say('Apple');setTimeout(()=>alert(!('speechSynthesis' in window)?'المتصفح لا يدعم النطق. استخدم Chrome.':en?'تم إرسال الصوت. إن لم تسمع شيئاً: ارفع مستوى الصوت وتأكد أن الجوال ليس على الصامت.':'لا يوجد صوت إنجليزي ('+n+' أصوات). افتح إعدادات الجوال > اللغة والإدخال > تحويل النص إلى كلام، اختر محرك Google ونزّل بيانات الصوت الإنجليزي.'),800)}
async function ai(path,body){const u=(S.ai||'').replace(/\/+$/,'');if(!u)return null;try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);const r=await fetch(u+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:c.signal});clearTimeout(t);return r.ok?await r.json():null}catch(e){return null}}
function aiSave(){S.ai=$('#aiu').value.trim();save();ai('/health',{}).then(r=>alert(r&&r.ok?'الاتصال ناجح ✅':'تعذّر الاتصال. التطبيق يعمل بدون الذكاء الاصطناعي.'))}
async function aiQuiz(){const w=IT.filter(i=>K.it[i.k]&&K.it[i.k].w>0).sort((a,b)=>K.it[b.k].w-K.it[a.k].w).slice(0,5);if(!w.length){alert('لا توجد أخطاء بعد 🎉');return}
 A.innerHTML='<div class="card" style="text-align:center"><div class="big">🤖</div>جارٍ تجهيز اختبار خاص بك...</div>';
 const r=await ai('/quiz',{items:w.map(i=>({k:i.k,en:i.w||i.c||''+i.n,ar:i.ar}))});
 let qs=((r&&r.questions)||[]).filter(x=>x&&x.p&&Array.isArray(x.o)&&x.o.length>=2&&x.o.length<=4&&IT.some(i=>i.k==x.k)).slice(0,6).map(x=>{const it=IT.find(i=>i.k==x.k),o=x.o.map((h,j)=>({k:''+j,h:esc(h)})),c=o[x.a|0];return c?{it,ty:'ai',ans:c.k,p:esc(x.p),big:'🤖',sm:1,o:sh(o)}:null}).filter(Boolean);
 if(!qs.length)qs=w.map(mk);ses=mkS({m:'r',qs});ses.n=qs.length;showQ()}
function chars(){V='ch';A.innerHTML='<div class="top"><h3>🎁 شخصياتي</h3><button class="g" onclick="home()">رجوع</button></div><p class="mut">⭐ '+K.xp+' XP — كلما جمعت نقاطاً فتحت شخصية جديدة</p><div class="grid">'+CH.map(([c,x],i)=>'<button class="opt" '+(K.xp>=x?'':'disabled ')+'onclick="pickC('+i+')" style="'+(K.av==c?'border-color:var(--pri)':'')+'">'+(K.xp>=x?c:'🔒')+'<br><small>'+(K.xp>=x?(K.av==c?'مختارة':'اختر'):x+' XP')+'</small></button>').join('')+'</div>'}
function pickC(i){if(K.xp>=CH[i][1]){K.av=CH[i][0];save();chars()}}
function mic(){const it=ses.items[ses.in],m=$('#mr'),r=new SR(),nm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').trim(),tg=nm(it.w);r.lang='en-US';r.maxAlternatives=5;m.textContent='🎤 تكلم الآن...';
 r.onresult=e=>{const al=[...e.results[0]].map(x=>nm(x.transcript)),ok=al.some(a=>a.includes(tg)||(it.t=='N'&&a==''+it.n));m.textContent=ok?'✅ نطق ممتاز! 🌟':'🙂 سمعت: '+al[0]+' — جرّب مرة أخرى';if(ok)beep(1)};
 r.onerror=()=>{m.textContent='لم أسمعك. اسمح بالميكروفون وجرّب مرة أخرى.'};try{r.start()}catch(e){m.textContent='الميكروفون غير متاح'}}
try{navigator.storage.persist()}catch(e){}load();S.cur!=null&&S.kids[S.cur]?pickK(S.cur):who();
</script></body></html>
