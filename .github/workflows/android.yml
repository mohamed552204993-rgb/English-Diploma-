name: Build English Diploma APK
# Build includes the native speech plugins for microphone input and TTS.

on:
  push:
    branches:
      - capacitor-build
      - offline-speech-recognition
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          tar --exclude='./.git' --exclude='./.github' --exclude='./node_modules' --exclude='./www' -cf - . | tar -xf - -C www

      - name: Bundle native speech plugins
        run: |
          npx esbuild native-plugins-entry.js --bundle --platform=browser --format=iife --target=es2020 --outfile=www/native-plugins.js
          python - <<'PY'
          from pathlib import Path
          path = Path("www/index.html")
          html = path.read_text(encoding="utf-8")
          tag = '<script src="./native-plugins.js"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("Could not find </body> in www/index.html")
              html = html.replace("</body>", tag + "\n</body>", 1)
              path.write_text(html, encoding="utf-8")
          print("Native speech plugins bundled and attached to the APK page.")
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Add offline Sherpa ONNX speech engine
        run: |
          # Download the small English streaming model and bundle only the quantized files.
          mkdir -p /tmp/sherpa-model android/app/src/main/assets/sherpa-onnx-en
          curl -fL --retry 3 --retry-delay 2 \
            -o /tmp/sherpa-model.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/asr-models/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17.tar.bz2
          tar -xjf /tmp/sherpa-model.tar.bz2 -C /tmp/sherpa-model
          MODEL_DIR="/tmp/sherpa-model/sherpa-onnx-streaming-zipformer-en-20M-2023-02-17"
          test -s "$MODEL_DIR/encoder-epoch-99-avg-1.int8.onnx"
          test -s "$MODEL_DIR/decoder-epoch-99-avg-1.onnx"
          test -s "$MODEL_DIR/joiner-epoch-99-avg-1.int8.onnx"
          test -s "$MODEL_DIR/tokens.txt"
          cp "$MODEL_DIR/encoder-epoch-99-avg-1.int8.onnx" android/app/src/main/assets/sherpa-onnx-en/
          cp "$MODEL_DIR/decoder-epoch-99-avg-1.onnx" android/app/src/main/assets/sherpa-onnx-en/
          cp "$MODEL_DIR/joiner-epoch-99-avg-1.int8.onnx" android/app/src/main/assets/sherpa-onnx-en/
          cp "$MODEL_DIR/tokens.txt" android/app/src/main/assets/sherpa-onnx-en/
          echo "Bundled offline English model:"
          du -h android/app/src/main/assets/sherpa-onnx-en/*

          # Add JitPack and the official Sherpa-ONNX Android library.
          python - <<'PY'
          from pathlib import Path
          import re
          settings = Path("android/settings.gradle")
          s = settings.read_text()
          marker = "dependencyResolutionManagement"
          if marker not in s:
              raise SystemExit("Unexpected settings.gradle: dependencyResolutionManagement block missing")
          if "https://jitpack.io" not in s:
              s = re.sub(r"(dependencyResolutionManagement\\s*\\{[\\s\\S]*?repositories\\s*\\{)", r"\\1\\n        maven { url 'https://jitpack.io' }", s, count=1)
          settings.write_text(s)

          gradle = Path("android/app/build.gradle")
          g = gradle.read_text()
          dep = "implementation 'com.github.k2-fsa.sherpa-onnx:sherpa-onnx:v2.0.3'"
          if dep not in g:
              if "dependencies {" not in g:
                  raise SystemExit("Unexpected app/build.gradle: dependencies block missing")
              g = g.replace("dependencies {", "dependencies {\\n    " + dep, 1)
          gradle.write_text(g)

          # Register the custom Capacitor plugin in the generated Android project.
          source = Path("android-native")
          target = Path("android/app/src/main/java/com/englishdiploma/app")
          target.mkdir(parents=True, exist_ok=True)
          for name in ("OfflineSpeechRecognitionPlugin.java", "MainActivity.java"):
              (target / name).write_text((source / name).read_text())
          PY

      - name: Add Android microphone permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
          echo "Android microphone permissions:"
          grep 'android.permission.*AUDIO' "$MANIFEST"

      - name: Prepare original app icon
        run: |
          python -m pip install --quiet pillow
          mkdir -p assets
          python - <<'PY'
          from PIL import Image
          image = Image.open("icons/icon-512.png").convert("RGBA")
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          image.save("assets/icon.png")
          PY

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Diploma-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
