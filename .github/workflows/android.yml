name: Build English Diploma APK
# Build includes the native speech plugins for microphone input and TTS.

on:
  push:
    branches:
      - capacitor-build
      - feature/optional-foundations-20261128
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm install

      - name: Prepare web files
        run: |
          mkdir -p www
          tar --exclude='./.git' --exclude='./.github' --exclude='./node_modules' --exclude='./www' -cf - . | tar -xf - -C www

      - name: Bundle native speech plugins
        run: |
          npx esbuild native-plugins-entry.js --bundle --platform=browser --format=iife --target=es2020 --outfile=www/native-plugins.js
          python - <<'PY'
          from pathlib import Path
          path = Path("www/index.html")
          html = path.read_text(encoding="utf-8")
          tag = '<script src="./native-plugins.js"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("Could not find </body> in www/index.html")
              html = html.replace("</body>", tag + "\n</body>", 1)
              path.write_text(html, encoding="utf-8")
          print("Native speech plugins bundled and attached to the APK page.")
          PY

      - name: Attach grammar-only interaction layer
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("www/index.html")
          html = path.read_text(encoding="utf-8")
          tag = '<script src="./grammar-enhancements.js"></script>'
          if tag not in html:
              if "</body>" not in html:
                  raise SystemExit("Could not find </body> in www/index.html")
              html = html.replace("</body>", tag + "\n</body>", 1)
              path.write_text(html, encoding="utf-8")
          print("Grammar-only audio and long-press help attached.")
          PY

      - name: Add Android platform
        run: npx cap add android

      - name: Set increasing Android version code
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              defaultConfig {
                  versionCode 10000 + Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER"))
              }
          }
          EOF

      - name: Configure stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "ERROR: Stable signing secrets are required. Refusing to create an un-updatable debug APK."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android-upload-key.jks
          test -s android-upload-key.jks
          mv android-upload-key.jks android/app/stable-upload-key.jks
          cat >> android/app/build.gradle <<'EOF'

          // Use the same private signing key for every update.
          android {
              signingConfigs {
                  debug {
                      storeFile file("stable-upload-key.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias "englishdiploma"
                      keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
          }
          EOF

      - name: Verify stable signing key
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -s android/app/stable-upload-key.jks || { echo "Stable signing key missing"; exit 1; }
          keytool -list -keystore android/app/stable-upload-key.jks -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias englishdiploma

      - name: Add Android microphone permissions
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.RECORD_AUDIO" />' "$MANIFEST"
          grep -q 'android.permission.MODIFY_AUDIO_SETTINGS' "$MANIFEST" || sed -i '/<application/i\    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
          echo "Android microphone permissions:"
          grep 'android.permission.*AUDIO' "$MANIFEST"

      - name: Prepare original app icon
        run: |
          python -m pip install --quiet pillow
          mkdir -p assets
          python - <<'PY'
          from PIL import Image
          image = Image.open("icons/icon-512.png").convert("RGBA")
          image = image.resize((1024, 1024), Image.Resampling.LANCZOS)
          image.save("assets/icon.png")
          PY

      - name: Generate Android launcher icons
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync Android
        run: npx cap sync android

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: English-Diploma-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
